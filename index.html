<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Endless Runner - Neon Nightmare</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a0518;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
      z-index: 10;
    }
    #stats-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #ff00ff;
      font-size: 18px;
      text-align: right;
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.7);
      z-index: 10;
    }
    #shield-status, #magnet-status, #slowmo-status {
      margin-top: 5px;
      font-size: 16px;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      background: rgba(10, 10, 20, 0.9);
      border: 2px solid #ff00ff;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
      padding: 30px;
      border-radius: 10px;
      z-index: 20;
    }
    #game-over button {
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff007f, #7f00ff);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
    }
    #game-over button:hover {
      background: linear-gradient(45deg, #ff3399, #9933ff);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    Score: <span id="score">0</span> | Coins: <span id="coins">0</span>
    <div id="shield-status" style="color: #00ff66;">Shield [SPACEBAR]: READY</div>
    <div id="magnet-status" style="color: #ff9f43;">Magnet: READY</div>
    <div id="slowmo-status" style="color: #00d2d3;">Slow-Mo: READY</div>
  </div>

  <div id="stats-panel">
    High Score: <span id="high-score">0</span>
  </div>

  <div id="game-over">
    <h1 style="color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.8);">GAME OVER</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <p>Coins Collected: <span id="final-coins">0</span></p>
    <p id="new-high-score" style="color: #ffff00; font-weight: bold; display: none; text-shadow: 0 0 8px rgba(255,255,0,0.8);">New High Score!</p>
    <button onclick="resetGame()">Try Again</button>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'shield') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.4);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    const LANES = [-3, 0, 3];
    let currentLane = 1;
    let score = 0;
    let coinsCollected = 0;
    
    const INITIAL_SPEED = 30;
    const MAX_SPEED = 65;
    let speed = INITIAL_SPEED;
    let isGameOver = false;

    let highScore = localStorage.getItem('runner_nightmare_high_score') || 0;
    document.getElementById('high-score').innerText = highScore;

    let isShieldActive = false;
    let shieldCooldown = false;
    let isInvulnerable = false;
    
    let isMagnetActive = false;
    let magnetTimer = 0;

    let isSlowMoActive = false;
    let slowMoTimer = 0;

    let particles = [];

    const BASE_Y = 0.9;
    let velocityY = 0;
    const gravity = -68;
    const jumpPower = 15.0;
    let isGrounded = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0518);
    scene.fog = new THREE.FogExp2(0x0a0518, 0.015);

    const clock = new THREE.Clock();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xff00ff, 1.2);
    dirLight.position.set(10, 25, 10);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x00ffff, 2, 50);
    pointLight.position.set(0, 5, 0);
    scene.add(pointLight);

    const trackGeometry = new THREE.PlaneGeometry(12, 1000);
    const trackMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x141125, 
      roughness: 0.4,
      metalness: 0.2
    });
    const track = new THREE.Mesh(trackGeometry, trackMaterial);
    track.rotation.x = -Math.PI / 2;
    track.position.set(0, -0.05, -400);
    scene.add(track);

    LANES.forEach(x => {
      const railGeo = new THREE.BoxGeometry(0.2, 0.15, 1000);
      const railMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const rail1 = new THREE.Mesh(railGeo, railMat);
      const rail2 = new THREE.Mesh(railGeo, railMat);
      rail1.position.set(x - 0.8, 0.05, -400);
      rail2.position.set(x + 0.8, 0.05, -400);
      scene.add(rail1);
      scene.add(rail2);
    });

    const playerGeo = new THREE.BoxGeometry(0.8, 1.6, 0.8);
    const playerMat = new THREE.MeshStandardMaterial({ 
      color: 0xff0055, 
      emissive: 0xff0055, 
      emissiveIntensity: 0.5,
      roughness: 0.2
    });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(LANES[currentLane], BASE_Y, 0);
    scene.add(player);
    player.add(pointLight);

    const shieldGeo = new THREE.SphereGeometry(1.2, 16, 16);
    const shieldMat = new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true, transparent: true, opacity: 0.8 });
    const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
    shieldMesh.visible = false;
    player.add(shieldMesh);

    camera.position.set(0, 5, 8);
    camera.lookAt(0, 1.5, -5);

    let obstacles = [];
    let tunnels = [];
    let coins = [];
    let powerups = [];
    let nextSpawnZ = -30;

    function spawnTrain(zPos, laneOverride = null) {
      const lane = laneOverride !== null ? laneOverride : LANES[Math.floor(Math.random() * LANES.length)];
      const trainGeo = new THREE.BoxGeometry(2.0, 2.8, 12);
      const trainMat = new THREE.MeshStandardMaterial({ 
        color: 0x7b2cbf, 
        emissive: 0x3c096c, 
        emissiveIntensity: 0.6,
        roughness: 0.3 
      });
      const train = new THREE.Mesh(trainGeo, trainMat);
      train.position.set(lane, 1.4, zPos);
      train.userData = { type: 'train' };
      scene.add(train);
      obstacles.push(train);
    }

    function spawnRamp(zPos, laneOverride = null) {
      const lane = laneOverride !== null ? laneOverride : LANES[Math.floor(Math.random() * LANES.length)];
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.lineTo(0, 1.5);
      shape.lineTo(6, 0);
      shape.closePath();

      const extrudeSettings = { depth: 2.0, bevelEnabled: false };
      const rampGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const rampMat = new THREE.MeshStandardMaterial({ 
        color: 0xff9f43, 
        emissive: 0xff6b00, 
        emissiveIntensity: 0.7 
      });
      const ramp = new THREE.Mesh(rampGeo, rampMat);
      
      ramp.rotation.y = Math.PI / 2;
      ramp.position.set(lane - 1.0, 0, zPos);
      ramp.userData = { type: 'ramp' };
      scene.add(ramp);
      obstacles.push(ramp);
    }

    function spawnTunnel(zPos) {
      const tunnelGroup = new THREE.Group();
      
      const wallGeo = new THREE.BoxGeometry(0.5, 4, 15);
      const wallMat = new THREE.MeshStandardMaterial({ 
        color: 0x00b4d8, 
        emissive: 0x0077b6, 
        emissiveIntensity: 0.4 
      });
      const leftWall = new THREE.Mesh(wallGeo, wallMat);
      leftWall.position.set(-5.5, 2, 0);
      tunnelGroup.add(leftWall);

      const rightWall = new THREE.Mesh(wallGeo, wallMat);
      rightWall.position.set(5.5, 2, 0);
      tunnelGroup.add(rightWall);

      const roofGeo = new THREE.BoxGeometry(12, 0.5, 15);
      const roofMat = new THREE.MeshStandardMaterial({ 
        color: 0x7209b7, 
        emissive: 0x560bad, 
        emissiveIntensity: 0.5 
      });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.set(0, 4.25, 0);
      tunnelGroup.add(roof);

      tunnelGroup.position.set(0, 0, zPos);
      scene.add(tunnelGroup);
      tunnels.push(tunnelGroup);
    }

    function spawnCoin(zPos, lane, height = 0.8) {
      const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
      const coinMat = new THREE.MeshStandardMaterial({ 
        color: 0xffea00, 
        emissive: 0xffbb00, 
        emissiveIntensity: 0.9 
      });
      const coin = new THREE.Mesh(coinGeo, coinMat);
      coin.rotation.x = Math.PI / 2;
      coin.position.set(lane, height, zPos);
      scene.add(coin);
      coins.push(coin);
    }

    function spawnPowerUp(zPos) {
      const lane = LANES[Math.floor(Math.random() * LANES.length)];
      const type = Math.random() < 0.5 ? 'magnet' : 'slowmo';
      
      const geo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
      const mat = new THREE.MeshStandardMaterial({ 
        color: type === 'magnet' ? 0xff00ff : 0x00ffcc,
        emissive: type === 'magnet' ? 0xff00ff : 0x00ffcc,
        emissiveIntensity: 0.8
      });
      const powerup = new THREE.Mesh(geo, mat);
      powerup.position.set(lane, 1.0, zPos);
      powerup.userData = { type: type };
      scene.add(powerup);
      powerups.push(powerup);
    }

    function spawnChunk(zPos) {
      const rand = Math.random();
      // Generous safe zones (even higher chance of empty sections)
      if (rand < 0.45) {
        // Safe path with lots of coins
      } else if (rand < 0.65) {
        spawnTrain(zPos);
      } else if (rand < 0.75) {
        // Only allow single trains instead of double walls to keep it very relaxed
        spawnTrain(zPos);
      } else if (rand < 0.88) {
        spawnRamp(zPos);
      } else if (rand < 0.95) {
        spawnTunnel(zPos);
      } else {
        spawnPowerUp(zPos);
      }
      
      LANES.forEach(lane => {
        spawnCoin(zPos - 2, lane);
        spawnCoin(zPos - 5, lane);
        spawnCoin(zPos - 8, lane);
      });
    }

    function createExplosion(position) {
      const particleCount = 30;
      const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
      
      for (let i = 0; i < particleCount; i++) {
        const material = new THREE.MeshBasicMaterial({
          color: Math.random() > 0.5 ? 0xff0055 : 0x00ffff
        });
        const particle = new THREE.Mesh(geometry, material);
        particle.position.copy(position);

        particle.userData = {
          vx: (Math.random() - 0.5) * 18,
          vy: Math.random() * 14 + 2,
          vz: (Math.random() - 0.5) * 18,
          life: 1.0
        };

        scene.add(particle);
        particles.push(particle);
      }
    }

    for (let z = -30; z > -300; z -= 18) {
      spawnChunk(z);
      nextSpawnZ = z - 18;
    }

    document.addEventListener('keydown', (e) => {
      if (isGameOver) return;

      if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > 0) {
        currentLane--;
      }
      if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < LANES.length - 1) {
        currentLane++;
      }
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && isGrounded) {
        velocityY = jumpPower;
        isGrounded = false;
        playSound('jump');
      }
      if (e.key === ' ' && !isShieldActive && !shieldCooldown) {
        activateShield();
      }
    });

    function activateShield() {
      isShieldActive = true;
      shieldMesh.visible = true;
      playSound('shield');
      document.getElementById('shield-status').innerText = "Shield [SPACEBAR]: ACTIVE!";
      document.getElementById('shield-status').style.color = "#00ff66";
    }

    function deactivateShield() {
      isShieldActive = false;
      shieldMesh.visible = false;
      shieldCooldown = true;
      isInvulnerable = true;

      setTimeout(() => { isInvulnerable = false; }, 200);

      document.getElementById('shield-status').innerText = "Shield [SPACEBAR]: RECHARGING...";
      document.getElementById('shield-status').style.color = "#ff4757";

      setTimeout(() => {
        shieldCooldown = false;
        document.getElementById('shield-status').innerText = "Shield [SPACEBAR]: READY";
        document.getElementById('shield-status').style.color = "#00ff66";
      }, 11000);
    }

    function activateMagnet() {
      isMagnetActive = true;
      magnetTimer = 3.5;
      playSound('powerup');
      document.getElementById('magnet-status').innerText = "Magnet: ACTIVE!";
    }

    function activateSlowMo() {
      isSlowMoActive = true;
      slowMoTimer = 4.0;
      playSound('powerup');
      document.getElementById('slowmo-status').innerText = "Slow-Mo: ACTIVE!";
    }

    function animate() {
      if (isGameOver) return;
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      let currentSpeed = speed;
      if (isSlowMoActive) {
        currentSpeed *= 0.5;
      }

      if (speed < MAX_SPEED) {
        speed += 0.8 * delta;
      }
      score += Math.floor(currentSpeed * delta * 15);
      document.getElementById('score').innerText = score;

      if (nextSpawnZ > -player.position.z - 300) {
        spawnChunk(nextSpawnZ);
        nextSpawnZ -= 18;
      }

      if (isMagnetActive) {
        magnetTimer -= delta;
        document.getElementById('magnet-status').innerText = `Magnet: ${Math.ceil(magnetTimer)}s`;
        if (magnetTimer <= 0) {
          isMagnetActive = false;
          document.getElementById('magnet-status').innerText = "Magnet: READY";
        }
      }

      if (isSlowMoActive) {
        slowMoTimer -= delta;
        document.getElementById('slowmo-status').innerText = `Slow-Mo: ${Math.ceil(slowMoTimer)}s`;
        if (slowMoTimer <= 0) {
          isSlowMoActive = false;
          document.getElementById('slowmo-status').innerText = "Slow-Mo: READY";
        }
      }

      player.position.x += (LANES[currentLane] - player.position.x) * (25 * delta);

      player.position.y += velocityY * delta;
      velocityY += gravity * delta;

      if (player.position.y <= BASE_Y) {
        player.position.y = BASE_Y;
        velocityY = 0;
        isGrounded = true;
      }

      if (isShieldActive) {
        shieldMesh.rotation.y += 3 * delta;
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.x += p.userData.vx * delta;
        p.position.y += p.userData.vy * delta;
        p.position.z += p.userData.vz * delta;
        p.userData.life -= 2.0 * delta;

        p.scale.setScalar(Math.max(0, p.userData.life));

        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }

      const playerBox = new THREE.Box3().setFromObject(player);
      playerBox.expandByScalar(-0.02);

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += currentSpeed * delta;

        const obsBox = new THREE.Box3().setFromObject(obs);

        if (playerBox.intersectsBox(obsBox)) {
          if (obs.userData.type === 'ramp') {
            velocityY = jumpPower * 1.02;
            isGrounded = false;
            playSound('jump');
          } else if (obs.userData.type === 'train') {
            if (isShieldActive) {
              createExplosion(obs.position);
              scene.remove(obs);
              obstacles.splice(i, 1);
              deactivateShield();
              playSound('crash');
              continue;
            } else if (!isInvulnerable) {
              playSound('crash');
              triggerGameOver();
              return;
            }
          }
        }

        if (obs.position.z > 15) {
          scene.remove(obs);
          obstacles.splice(i, 1);
        }
      }

      for (let i = tunnels.length - 1; i >= 0; i--) {
        const tun = tunnels[i];
        tun.position.z += currentSpeed * delta;

        if (tun.position.z > 15) {
          scene.remove(tun);
          tunnels.splice(i, 1);
        }
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const pUp = powerups[i];
        pUp.position.z += currentSpeed * delta;
        pUp.rotation.y += 4 * delta;

        const pUpBox = new THREE.Box3().setFromObject(pUp);
        if (playerBox.intersectsBox(pUpBox)) {
          scene.remove(pUp);
          powerups.splice(i, 1);
          if (pUp.userData.type === 'magnet') {
            activateMagnet();
          } else {
            activateSlowMo();
          }
        } else if (pUp.position.z > 15) {
          scene.remove(pUp);
          powerups.splice(i, 1);
        }
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.position.z += currentSpeed * delta;
        coin.rotation.z += 4 * delta;

        if (isMagnetActive && Math.abs(coin.position.z - player.position.z) < 25) {
          coin.position.x += (player.position.x - coin.position.x) * 12 * delta;
          coin.position.y += (player.position.y - coin.position.y) * 12 * delta;
        }

        const coinBox = new THREE.Box3().setFromObject(coin);

        if (playerBox.intersectsBox(coinBox)) {
          scene.remove(coin);
          coins.splice(i, 1);
          coinsCollected++;
          playSound('coin');
          document.getElementById('coins').innerText = coinsCollected;
        } else if (coin.position.z > 15) {
          scene.remove(coin);
          coins.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    function triggerGameOver() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-coins').innerText = coinsCollected;

      let isNewHigh = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('runner_nightmare_high_score', highScore);
        document.getElementById('high-score').innerText = highScore;
        isNewHigh = true;
      }

      document.getElementById('new-high-score').style.display = isNewHigh ? 'block' : 'none';
      document.getElementById('game-over').style.display = 'block';
    }

    function resetGame() {
      obstacles.forEach(obs => scene.remove(obs));
      tunnels.forEach(tun => scene.remove(tun));
      coins.forEach(coin => scene.remove(coin));
      powerups.forEach(m => scene.remove(m));
      particles.forEach(p => scene.remove(p));
      obstacles = [];
      tunnels = [];
      coins = [];
      powerups = [];
      particles = [];

      score = 0;
      coinsCollected = 0;
      speed = INITIAL_SPEED;
      currentLane = 1;
      player.position.set(LANES[1], BASE_Y, 0);
      velocityY = 0;
      isGrounded = true;
      isGameOver = false;
      isInvulnerable = false;
      isMagnetActive = false;
      isSlowMoActive = false;

      isShieldActive = false;
      shieldCooldown = false;
      shieldMesh.visible = false;
      document.getElementById('shield-status').innerText = "Shield [SPACEBAR]: READY";
      document.getElementById('shield-status').style.color = "#00ff66";
      document.getElementById('magnet-status').innerText = "Magnet: READY";
      document.getElementById('slowmo-status').innerText = "Slow-Mo: READY";

      document.getElementById('score').innerText = '0';
      document.getElementById('coins').innerText = '0';
      document.getElementById('game-over').style.display = 'none';

      nextSpawnZ = -30;
      clock.start();

      for (let z = -30; z > -300; z -= 18) {
        spawnChunk(z);
        nextSpawnZ = z - 18;
      }

      animate();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
