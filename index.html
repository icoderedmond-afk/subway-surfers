<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Endless Runner - Neon Nightmare</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a0518;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
      z-index: 10;
    }
    #stats-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #ff00ff;
      font-size: 18px;
      text-align: right;
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.7);
      z-index: 10;
    }
    #shield-status, #magnet-status, #slowmo-status {
      margin-top: 5px;
      font-size: 16px;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      background: rgba(10, 10, 20, 0.9);
      border: 2px solid #ff00ff;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
      padding: 30px;
      border-radius: 10px;
      z-index: 20;
    }
    #game-over button {
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff007f, #7f00ff);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
    }
    #game-over button:hover {
      background: linear-gradient(45deg, #ff3399, #9933ff);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    Score: <span id="score">0</span> | Coins: <span id="coins">0</span>
    <div id="shield-status" style="color: #00ff66;">Shield [SPACEBAR]: READY</div>
    <div id="magnet-status" style="color: #ff9f43;">Magnet: READY</div>
    <div id="slowmo-status" style="color: #00d2d3;">Slow-Mo: READY</div>
  </div>

  <div id="stats-panel">
    High Score: <span id="high-score">0</span>
  </div>

  <div id="game-over">
    <h1 style="color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.8);">GAME OVER</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <p>Coins Collected: <span id="final-coins">0</span></p>
    <p id="new-high-score" style="color: #ffff00; font-weight: bold; display: none; text-shadow: 0 0 8px rgba(255,255,0,0.8);">New High Score!</p>
    <button onclick="resetGame()">Try Again</button>
  </div>
