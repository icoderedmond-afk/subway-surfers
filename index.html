<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Endless Runner - Nightmare Mode</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }
    #stats-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 18px;
      text-align: right;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }
    #shield-status, #magnet-status {
      margin-top: 5px;
      font-size: 16px;
      color: #00d2d3;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      background: rgba(0, 0, 0, 0.85);
      padding: 30px;
      border-radius: 10px;
      z-index: 20;
    }
    #game-over button {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }
    #game-over button:hover {
      background-color: #ff6b81;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    Score: <span id="score">0</span> | Coins: <span id="coins">0</span>
    <div id="shield-status">Shield [SPACEBAR]: READY</div>
    <div id="magnet-status" style="color: #ff9f43;">Magnet: READY</div>
  </div>

  <div id="stats-panel">
    High Score: <span id="high-score">0</span>
  </div>

  <div id="game-over">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <p>Coins Collected: <span id="final-coins">0</span></p>
    <p id="new-high-score" style="color: #ffdd59; font-weight: bold; display: none;">New High Score!</p>
    <button onclick="resetGame()">Try Again</button>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'shield') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.4);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    const LANES = [-3, 0, 3];
    let currentLane = 1;
    let score = 0;
    let coinsCollected = 0;
    
    const INITIAL_SPEED = 45;
    const MAX_SPEED = 90;
    let speed = INITIAL_SPEED;
    let isGameOver = false;

    let highScore = localStorage.getItem('runner_nightmare_high_score') || 0;
    document.getElementById('high-score').innerText = highScore;

    let isShieldActive = false;
    let shieldCooldown = false;
    let isInvulnerable = false;
    let isMagnetActive = false;
    let magnetTimer = 0;
    let particles = [];

    const BASE_Y = 0.9;
    let velocityY = 0;
    const gravity = -68;
    const jumpPower = 15.0;
    let isGrounded = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f0f11);
    scene.fog = new THREE.Fog(0x0f0f11, 20, 220); // Expanded fog range

    const clock = new THREE.Clock();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const trackGeometry = new THREE.PlaneGeometry(12, 500);
    const trackMaterial = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const track = new THREE.Mesh(trackGeometry, trackMaterial);
    track.rotation.x = -Math.PI / 2;
    track.position.set(0, -0.05, -200);
    scene.add(track);

    LANES.forEach(x => {
      const railGeo = new THREE.BoxGeometry(0.2, 0.1, 500);
      const railMat = new THREE.MeshLambertMaterial({ color: 0x485460 });
      const rail1 = new THREE.Mesh(railGeo, railMat);
      const rail2 = new THREE.Mesh(railGeo, railMat);
      rail1.position.set(x - 0.8, 0.05, -200);
      rail2.position.set(x + 0.8, 0.05, -200);
      scene.add(rail1);
      scene.add(rail2);
    });

    const playerGeo = new THREE.BoxGeometry(0.8, 1.6, 0.8);
    const playerMat = new THREE.MeshLambertMaterial({ color: 0xeb2f06 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(LANES[currentLane], BASE_Y, 0);
    scene.add(player);

    const shieldGeo = new THREE.SphereGeometry(1.2, 16, 16);
    const shieldMat = new THREE.MeshBasicMaterial({ color: 0x0be881, wireframe: true, transparent: true, opacity: 0.8 });
    const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
    shieldMesh.visible = false;
    player.add(shieldMesh);

    camera.position.set(0, 5, 8);
    camera.lookAt(0, 1.5, -5);

    let obstacles = [];
    let coins = [];
    let powerups = [];

    function spawnTrain(zPos) {
      const lane = LANES[Math.floor(Math.random() * LANES.length)];
      const trainGeo = new THREE.BoxGeometry(2.0, 2.8, 12);
      const trainMat = new THREE.MeshLambertMaterial({ color: 0x1e272e });
      const train = new THREE.Mesh(trainGeo, trainMat);
      train.position.set(lane, 1.4, zPos);
      train.userData = { type: 'train' };
      scene.add(train);
      obstacles.push(train);
    }

    function spawnRamp(zPos) {
      const lane = LANES[Math.floor(Math.random() * LANES.length)];
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.lineTo(0, 1.5);
      shape.lineTo(6, 0);
      shape.closePath();

      const extrudeSettings = { depth: 2.0, bevelEnabled: false };
      const rampGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const rampMat = new THREE.MeshLambertMaterial({ color: 0xf53b57 });
      const ramp = new THREE.Mesh(rampGeo, rampMat);
      
      ramp.rotation.y = Math.PI / 2;
      ramp.position.set(lane - 1.0, 0, zPos);
      ramp.userData = { type: 'ramp' };
      scene.add(ramp);
      obstacles.push(ramp);
    }

    function spawnCoin(zPos, lane, height = 0.8) {
      const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
      const coinMat = new THREE.MeshLambertMaterial({ color: 0xfffa65 });
      const coin = new THREE.Mesh(coinGeo, coinMat);
      coin.rotation.x = Math.PI / 2;
      coin.position.set(lane, height, zPos);
      scene.add(coin);
      coins.push(coin);
    }

    function spawnMagnetPowerUp(zPos) {
      const lane = LANES[Math.floor(Math.random() * LANES.length)];
      const magGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
      const magMat = new THREE.MeshLambertMaterial({ color: 0xefa8e4 });
      const mag = new THREE.Mesh(magGeo, magMat);
      mag.position.set(lane, 1.0, zPos);
      mag.userData = { type: 'magnet' };
      scene.add(mag);
      powerups.push(mag);
    }

    function createExplosion(position) {
      const particleCount = 25;
      const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
      
      for (let i = 0; i < particleCount; i++) {
        const material = new THREE.MeshBasicMaterial({
          color: Math.random() > 0.5 ? 0xeb2f06 : 0xf53b57
        });
        const particle = new THREE.Mesh(geometry, material);
        particle.position.copy(position);

        particle.userData = {
          vx: (Math.random() - 0.5) * 15,
          vy: Math.random() * 12 + 2,
          vz: (Math.random() - 0.5) * 15,
          life: 1.0
        };

        scene.add(particle);
        particles.push(particle);
      }
    }

    for (let z = -20; z > -220; z -= 18) {
      const rand = Math.random();
      if (rand < 0.75) spawnTrain(z);
      else if (rand < 0.90) spawnRamp(z);
      else spawnMagnetPowerUp(z);
      
      const coinLane = LANES[Math.floor(Math.random() * LANES.length)];
      spawnCoin(z - 2, coinLane);
    }

    document.addEventListener('keydown', (e) => {
      if (isGameOver) return;

      if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > 0) {
        currentLane--;
      }
      if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < LANES.length - 1) {
        currentLane++;
      }
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && isGrounded) {
        velocityY = jumpPower;
        isGrounded = false;
        playSound('jump');
      }
      if (e.key === ' ' && !isShieldActive && !shieldCooldown) {
        activateShield();
      }
    });

    function activateShield() {
      isShieldActive = true;
      shieldMesh.visible = true;
      playSound('shield');
      document.getElementById('shield-status').innerText = "Shield [SPACEBAR]: ACTIVE!";
      document.getElementById('shield-status').style.color = "#0be881";
    }

    function deactivateShield() {
      isShieldActive = false;
      shieldMesh.visible = false;
      shieldCooldown = true;
      isInvulnerable = true;

      setTimeout(() => { isInvulnerable = false; }, 200);

      document.getElementById('shield-status').innerText = "Shield [SPACEBAR]: RECHARGING...";
      document.getElementById('shield-status').style.color = "#ff4757";

      setTimeout(() => {
        shieldCooldown = false;
        document.getElementById('shield-status').innerText = "Shield [SPACEBAR]: READY";
        document.getElementById('shield-status').style.color = "#0be881";
      }, 11000);
    }

    function activateMagnet() {
      isMagnetActive = true;
      magnetTimer = 2.5;
      playSound('shield');
      document.getElementById('magnet-status').innerText = "Magnet: ACTIVE!";
    }

    function animate() {
      if (isGameOver) return;
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (speed < MAX_SPEED) {
        speed += 1.5 * delta;
      }
      score += Math.floor(speed * delta * 15);
      document.getElementById('score').innerText = score;

      if (isMagnetActive) {
        magnetTimer -= delta;
        document.getElementById('magnet-status').innerText = `Magnet: ${Math.ceil(magnetTimer)}s`;
        if (magnetTimer <= 0) {
          isMagnetActive = false;
          document.getElementById('magnet-status').innerText = "Magnet: READY";
        }
      }

      player.position.x += (LANES[currentLane] - player.position.x) * (25 * delta);

      player.position.y += velocityY * delta;
      velocityY += gravity * delta;

      if (player.position.y <= BASE_Y) {
        player.position.y = BASE_Y;
        velocityY = 0;
        isGrounded = true;
      }

      if (isShieldActive) {
        shieldMesh.rotation.y += 3 * delta;
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.x += p.userData.vx * delta;
        p.position.y += p.userData.vy * delta;
        p.position.z += p.userData.vz * delta;
        p.userData.life -= 2.0 * delta;

        p.scale.setScalar(Math.max(0, p.userData.life));

        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }

      const playerBox = new THREE.Box3().setFromObject(player);
      playerBox.expandByScalar(-0.02);

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += speed * delta;

        const obsBox = new THREE.Box3().setFromObject(obs);

        if (playerBox.intersectsBox(obsBox)) {
          if (obs.userData.type === 'ramp') {
            velocityY = jumpPower * 1.02;
            isGrounded = false;
            playSound('jump');
          } else if (obs.userData.type === 'train') {
            if (isShieldActive) {
              createExplosion(obs.position);
              scene.remove(obs);
              obstacles.splice(i, 1);
              deactivateShield();
              playSound('crash');
              continue;
            } else if (!isInvulnerable) {
              playSound('crash');
              triggerGameOver();
              return;
            }
          }
        }

        if (obs.position.z > 15) {
          scene.remove(obs);
          obstacles.splice(i, 1);
          
          const rand = Math.random();
          if (rand < 0.75) spawnTrain(-220);
          else if (rand < 0.90) spawnRamp(-220);
          else spawnMagnetPowerUp(-220);
        }
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const mag = powerups[i];
        mag.position.z += speed * delta;
        mag.rotation.y += 4 * delta;

        const magBox = new THREE.Box3().setFromObject(mag);
        if (playerBox.intersectsBox(magBox)) {
          scene.remove(mag);
          powerups.splice(i, 1);
          activateMagnet();
        } else if (mag.position.z > 15) {
          scene.remove(mag);
          powerups.splice(i, 1);
        }
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.position.z += speed * delta;
        coin.rotation.z += 4 * delta;

        if (isMagnetActive && Math.abs(coin.position.z - player.position.z) < 25) {
          coin.position.x += (player.position.x - coin.position.x) * 12 * delta;
          coin.position.y += (player.position.y - coin.position.y) * 12 * delta;
        }

        const coinBox = new THREE.Box3().setFromObject(coin);

        if (playerBox.intersectsBox(coinBox)) {
          scene.remove(coin);
          coins.splice(i, 1);
          coinsCollected++;
          playSound('coin');
          document.getElementById('coins').innerText = coinsCollected;
        } else if (coin.position.z > 15) {
          scene.remove(coin);
          coins.splice(i, 1);
          
          if (Math.random() < 0.3) {
            const lane = LANES[Math.floor(Math.random() * LANES.length)];
            spawnCoin(-220, lane);
          }
        }
      }

      renderer.render(scene, camera);
    }

    function triggerGameOver() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-coins').innerText = coinsCollected;

      let isNewHigh = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('runner_nightmare_high_score', highScore);
        document.getElementById('high-score').innerText = highScore;
        isNewHigh = true;
      }

      document.getElementById('new-high-score').style.display = isNewHigh ? 'block' : 'none';
      document.getElementById('game-over').style.display = 'block';
    }

    function resetGame() {
      obstacles.forEach(obs => scene.remove(obs));
      coins.forEach(coin => scene.remove(coin));
      powerups.forEach(m => scene.remove(m));
      particles.forEach(p => scene.remove(p));
      obstacles = [];
      coins = [];
      powerups = [];
      particles = [];

      score = 0;
      coinsCollected = 0;
      speed = INITIAL_SPEED;
      currentLane = 1;
      player.position.set(LANES[1], BASE_Y, 0);
      velocityY = 0;
      isGrounded = true;
      isGameOver = false;
      isInvulnerable = false;
      isMagnetActive = false;

      isShieldActive = false;
      shieldCooldown = false;
      shieldMesh.visible = false;
      document.getElementById('shield-status').innerText = "Shield [SPACEBAR]: READY";
      document.getElementById('shield-status').style.color = "#0be881";
      document.getElementById('magnet-status').innerText = "Magnet: READY";

      document.getElementById('score').innerText = '0';
      document.getElementById('coins').innerText = '0';
      document.getElementById('game-over').style.display = 'none';

      clock.start();

      for (let z = -20; z > -220; z -= 18) {
        if (Math.random() < 0.75) spawnTrain(z);
        else spawnRamp(z);

        const coinLane = LANES[Math.floor(Math.random() * LANES.length)];
        spawnCoin(z, coinLane);
      }

      animate();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
